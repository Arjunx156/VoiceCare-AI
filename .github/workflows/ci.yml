name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests need no secrets: external services (Gemini/Bhashini/Chroma) are
      # mocked, the DB is in-memory SQLite, and conftest forces the in-process
      # memory backend so nothing reaches Upstash.
      # The coverage floor lives in .coveragerc (fail_under).
      - name: Run tests with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          retention-days: 7

      # The machine-readable run record that feeds the public /tests page.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-report.json
          retention-days: 7

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      # Verify the /tests page data can still be produced from this commit.
      # Not diffed against the committed copy — timestamps and durations change
      # every run, so a byte comparison would always fail. The committed file is
      # refreshed deliberately via `npm run test:json && npm run test:report`.
      - name: Verify the test report still builds
        run: |
          npm run test:json
          npm run test:report

      - name: Production build (includes TypeScript check)
        run: npm run build

  e2e:
    name: E2E — Playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Backend APIs are mocked inside the specs (page.route), so the suite
      # needs only the Next production server that Playwright's webServer
      # config starts itself.
      - name: Run E2E smoke tests
        run: npm run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
