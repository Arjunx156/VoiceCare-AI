name: Keep Render backend warm

# Render's free plan spins the backend down after ~15 min idle regardless of
# any app-level config. Pinging /health every 10 min keeps it under that
# threshold during active hours; /health also runs a DB SELECT 1 (main.py),
# so this incidentally keeps the Neon Postgres connection warm too.
#
# --max-time is 180s, not the curl default: a full cold start (container was
# already asleep when this fires — e.g. the very first run, or after a gap
# wide enough for Render to spin down anyway) can take 50-90s to respond, per
# the same reasoning behind adminLogin's 65s abort timeout in api.ts. A short
# --max-time here made the wake-up ping itself time out (curl exit 28) before
# the backend finished waking. We also retry transient failures so a single
# network blip doesn't fail the warmup run.
#
# This does NOT replace the reactive cold-start handling already in the
# frontend (BackendWarmup.tsx, login page's "waking up" message) — those stay
# as the fallback for deploys/maintenance windows this can't prevent, and for
# the gap between two cron ticks (GitHub's scheduler can run a few minutes
# late under load; exact timing isn't the goal here).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors https://voicecare-backend.onrender.com/health
