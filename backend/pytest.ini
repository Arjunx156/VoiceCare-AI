[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
# Applied automatically from each test's directory by the
# pytest_collection_modifyitems hook in tests/conftest.py — do not hand-mark
# individual tests. `--strict-markers` is on, so every category must be
# declared here before its directory can be collected.
markers =
    unit: isolated logic — no DB, no network, all services mocked
    integration: multi-agent flows against the in-memory DB
    performance: latency budgets and query-count ceilings for the pipeline
    security: authn/authz, input limits, and information-leak defences
    multilingual: the 9 supported Indian languages end to end
    resilience: behaviour when an external dependency fails
    contract: wire-format guarantees between backend and frontend
    slow: tests that may take longer to run
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
